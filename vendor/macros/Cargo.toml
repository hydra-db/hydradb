[package]
name = "opendata-macros"
version = "0.1.0"
edition.workspace = true

# VENDORED into turbolay (M1) alongside vendor/common: the `storage_test` test
# macro is a dev-dependency of the vendored common crate. Proc-macro-only deps
# are pinned locally (they are specific to this crate).

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.4.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
opendata-common = { path = "../common" }