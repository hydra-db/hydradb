[package]
name = "opendata-common"
version = "0.1.17"
edition.workspace = true
description = "Shared storage foundation for OpenData databases"
license = "MIT"
repository = "https://github.com/opendata-oss/opendata"
readme = "README.md"
keywords = ["database", "storage", "slatedb"]
categories = ["database"]

# VENDORED into turbolay (M1). Forked from opendata-common 0.1.17 so turbolay can
# extend the storage layer — specifically WriteOptions.seqnum injection for the
# RFC 0004 logical-seq protocol — without mutating the shared upstream crate.
# Deps are inherited from the turbolay workspace ([workspace.dependencies] in the
# root Cargo.toml), pinned to the versions the opendata workspace used at fork
# time. `opendata-macros` (the `storage_test` test macro) is vendored alongside
# at vendor/macros; the `varint` bench was dropped (bench-only).
# See docs/impl/2026-07-03-m1-spike-and-seqnum-decision.md.

[lib]
name = "common"
path = "src/lib.rs"

[features]
default = []
test-utils = ["dep:arc-swap"]

[dependencies]
slatedb.workspace = true
slatedb-common.workspace = true
foyer.workspace = true
bytes.workspace = true
futures.workspace = true
async-trait.workspace = true
metrics.workspace = true
mixtrics.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ulid.workspace = true
uuid.workspace = true
serde.workspace = true
arc-swap = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
slatedb = { workspace = true, features = ["test-util"] }
slatedb-common = { workspace = true, features = ["test-util"] }
serde_yaml.workspace = true
proptest.workspace = true
tempfile.workspace = true
opendata-macros = { path = "../macros" }
