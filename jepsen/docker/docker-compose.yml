name: turbolay-jepsen

x-node: &node
  build:
    context: .
    dockerfile: node/Dockerfile
  cap_add:
    - NET_ADMIN   # iptables partitions
    - SYS_TIME    # clock skew nemesis
    - SYS_PTRACE
  networks:
    - jepsen
  tmpfs:
    - /run
  depends_on:
    minio-init:
      condition: service_completed_successfully

services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: jepsen
      MINIO_ROOT_PASSWORD: jepsenjepsen
    networks:
      - jepsen
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - jepsen
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 jepsen jepsenjepsen &&
      mc mb --ignore-existing local/jepsen &&
      echo minio-ready
      "

  n1: { <<: *node, hostname: n1, container_name: jepsen-n1 }
  n2: { <<: *node, hostname: n2, container_name: jepsen-n2 }
  n3: { <<: *node, hostname: n3, container_name: jepsen-n3 }
  n4: { <<: *node, hostname: n4, container_name: jepsen-n4 }
  n5: { <<: *node, hostname: n5, container_name: jepsen-n5 }

  control:
    build:
      context: ./control
    container_name: jepsen-control
    hostname: control
    networks:
      - jepsen
    cap_add:
      - NET_ADMIN
    volumes:
      - ../turbolay:/jepsen
      - ./ssh/id_rsa:/root/.ssh/id_rsa:ro
      - jepsen-m2:/root/.m2
    depends_on: [n1, n2, n3, n4, n5]
    command: ["sleep", "infinity"]

networks:
  jepsen:
    driver: bridge

volumes:
  jepsen-m2:
