nameOverride: ""
fullnameOverride: ""

image:
  # Published by .github/workflows/container.yml. An empty tag resolves to
  # Chart.appVersion.
  repository: ghcr.io/hydra-db/hydradb
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

objectStore:
  cloudProvider: aws
  aws:
    bucketName: ""
    region: us-east-1
    allowHttp: false
    endpoint: ""
    endpointEgressTo: []

graph:
  namespace: production
  graphId: default
  database: default
  cells:
    - cell-0
  dataPath: slatedb-graph/data

auth:
  existingSecret: ""
  secretKey: auth-token
  create: true
  token: ""
  preserveGeneratedToken: true
  externalSecret:
    enabled: false
    targetSecretName: ""
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: ""
    remoteRef:
      key: slatedb-graph/client-auth
      property: token

tls:
  public:
    enabled: true
    secretName: ""
    # The CA buddy WAL followers trust for their peers' certificates
    # (runtime.buddyWal). By default it is the `ca.crt` in the public TLS
    # secret, which cert-manager writes for a CA issuer. Name a Secret here to
    # take its `ca.crt` instead, as a secret supplied without cert-manager
    # usually carries only `tls.crt` and `tls.key`.
    peerCaSecretName: ""
    additionalDnsNames: []
    trustBundle:
      enabled: false
      name: ""
      sourceSecretName: ""
      sourceSecretKey: tls.crt
      # Extra trust-manager Bundle sources used for CA overlap during rotation
      # or migration. Every source must exist in trust-manager's configured
      # trust namespace.
      additionalSources: []
      namespaceSelector: {}
  certManager:
    enabled: false
    publicIssuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: ""
    publicDuration: 2160h
    publicRenewBefore: 360h

node:
  replicaCount: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 60
  updateStrategy: RollingUpdate
  rollingUpdatePartition: 0
  # Optional entrypoint override; empty lists preserve the image defaults.
  command: []
  args: []
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 12Gi
    limits:
      cpu: "8"
      memory: 16Gi
      ephemeral-storage: 24Gi
  cache:
    type: emptyDir
    memoryLimitBytes: 8589934592
    emptyDir:
      sizeLimit: 20Gi
      medium: ""
    persistentVolume:
      size: 40Gi
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      annotations: {}
  tmpSizeLimit: 1Gi
  affinity: {}
  topologySpreadConstraints: []
  tolerations: []
  nodeSelector: {}
  extraEnv: []

indexer:
  enabled: true
  replicaCount: 1
  # Retry delay after a failed scheduler pass.
  intervalMs: 5000
  # Least time one rotation of the fair sweep over every registered scope
  # takes; its cycles are spread evenly across it. Changed scopes arrive through
  # write hints, so the sweep is only the recovery path for a lost hint. Each
  # scope visit is a few object-store LIST/GET requests.
  fullSweepIntervalMs: 3600000
  # Backstop poll for durable post-write scope hints when no wake arrives.
  # Graph nodes wake the indexer after each hint, so this bounds the delay of a
  # lost wake, not normal discovery latency.
  dirtyPollIntervalMs: 60000
  # Minimum spacing between change passes, and between planner statistics
  # request listings. Wakes inside it coalesce into the next pass, so a write
  # burst cannot list hints or statistics requests faster than this.
  changeMinIntervalMs: 250
  retainPreviousGenerations: 1
  # "full" preserves the pre-incremental behavior. Set "incremental" after
  # validating the workload; unavailable or oversized WAL tails still fall
  # back to a full rebuild.
  buildMode: full
  # Small indexes can be cheaper to rebuild from the block cache. Incremental
  # mode uses the full path below this current-generation edge count.
  incrementalMinEdges: 250000
  # Number of graph scopes opened and indexed concurrently. Work is committed
  # to a durable progress cursor in batches of this size.
  scopeConcurrency: 8
  # Maximum total scopes processed by one scheduler cycle. Recently changed
  # cached scopes consume at most one quarter of this budget; the remainder
  # advances the durable fair-scan cursor.
  scopesPerCycle: 256
  # Maximum read-only scope handles retained between indexing cycles. Reusing
  # a handle avoids reopening its SlateDB reader and replaying durable state.
  # Size this for the registered scope population when memory permits; excess
  # scopes use bounded one-cycle readers. Must be at least scopeConcurrency.
  maxOpenScopes: 128
  # Keep serving readiness across isolated object-store failures. Consecutive
  # failed bounded cycles at this threshold mark the Pod unready.
  readinessFailureThreshold: 3
  # Decline an incremental build when its immutable WAL span is larger than
  # this and use the full snapshot build instead.
  maxWalTailFiles: 4096
  # The most edges one relationship type's index generation may hold. A type
  # above it gets no generation, and its build is retried at a backoff that
  # grows to fullSweepIntervalMs without costing readiness.
  maxArtifactBuildEdges: 10000000
  # Concurrent immutable WAL object reads and snapshot edge resolutions used
  # by one incremental build.
  walTailFetchConcurrency: 16
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 2Gi
    limits:
      cpu: "8"
      memory: 16Gi
      ephemeral-storage: 8Gi
  affinity: {}
  topologySpreadConstraints: []
  tolerations: []
  nodeSelector: {}
  extraEnv: []

service:
  advertisedBoltAddress: ""
  bolt:
    type: ClusterIP
    port: 7687
    annotations: {}
    loadBalancerSourceRanges: []
  https:
    type: ClusterIP
    port: 443
    annotations: {}
    loadBalancerSourceRanges: []
  adminPort: 9090

runtime:
  rustLog: info,hydradb=info
  # Buddy WAL (GRAPH_BUDDY_WAL): each node publishes its writers' durable
  # frontiers and follows its peers' over the public HTTPS listener, so a
  # replica catches up from the owner instead of polling object storage. On,
  # it also opens 8443 between graph-node pods in the NetworkPolicy; off, no
  # ingress on 8443 exists beyond networkPolicy.clientIngressFrom, and
  # GRAPH_BUDDY_WAL is not rendered at all (the node defaults to off).
  buddyWal: false
  maxOpenScopes: 8
  # One process-wide SlateDB RAM cache shared by every open reader and writer.
  # This is separate from node.cache.memoryLimitBytes, which budgets the
  # disposable on-disk object-store cache. Set to 0 to disable RAM admission.
  slatedbCacheBytes: 671088640
  # File handles the node's one on-disk object-store cache may keep open. Every
  # scope reads through that single cache, with node.cache.memoryLimitBytes as
  # its one budget, so neither is divided per scope.
  dataCacheMaxOpenFiles: 512
  maxConcurrentQueries: 256
  maxQueryScanEdges: 1000000
  # The most edges one relationship type may hold when the node reads its
  # adjacency from edge records rather than an index generation; the
  # indexer's limit is indexer.maxArtifactBuildEdges.
  maxArtifactBuildEdges: 10000000
  # Rows one query may return, the gds.*.stream calls included: one per
  # projected vertex.
  maxQueryResultVertices: 100000
  maxQueryRuntimeMs: 30000
  maxServerCursors: 1024
  maxCursorBufferBytes: 67108864
  cursorTtlMs: 60000
  maxBoltConnections: 4096
  boltAuthenticationTimeoutMs: 30000
  boltIdleTimeoutMs: 900000
  boltMaxConnectionAgeMs: 3600000
  defaultPageSize: 1024
  gracefulShutdownMs: 30000
  # Maximum time a non-empty SlateDB WAL may wait before durable object-store
  # flush. Concurrent writes arriving inside this window share one WAL object.
  walFlushIntervalMs: 50
  l0SstSizeBytes: 16777216
  maxUnflushedBytes: 67108864
  # Consolidate sparse durable writes before thousands of tiny WAL objects can
  # accumulate. At the default replay concurrency, 128 is eight replay waves.
  maxWalFlushesBeforeL0Flush: 128
  l0FlushParallelism: 1
  maxMatrixAdjacencies: 0
  maxMatrixAdjacencyBytes: 0
  maxGraphblasMatrices: 16
  maxGraphblasBytes: 134217728
  maxRelationshipRowsBytes: 8388608
  maxSourceRelationshipRowsBytes: 8388608
  maxRelationshipPropertyRowsBytes: 16777216
  maxGdsProjectedGraphBytes: 268435456
  maxConcurrentHydrations: 2
  maxConcurrentMatrixCompilations: 1
  indexDiscoveryIntervalMs: 5000
  # Durable S3 CAS ownership window. Nodes renew every one third of this value.
  writerLeaseMs: 30000
  trimMemoryAfterHydration: true

# The turbolay proxy: one Bolt and HTTPS endpoint in front of every graph-node,
# with pooling and owner routing. Off by default; clients use it once their
# TURBOLAY_URI points at the proxy service.
proxy:
  enabled: false
  replicaCount: 3
  image:
    repository: ghcr.io/hydra-db/hydradb-proxy
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # The env's read policy, the same knob graph-node reads. Behind the proxy the
  # nodes' own setting does nothing, since the proxy answers ROUTE.
  readRouting: fleet
  # Concurrent units per graph-node across all proxy replicas; each replica
  # holds nodeBudget / replicas.
  nodeBudget: 256
  routeTtlSeconds: 10
  # Advertise only the service in ROUTE, for callers that cannot reach pod IPs.
  # Always on with tls.public.enabled: drivers check the certificate against
  # every routed address, and pod IPs are not on it.
  advertiseService: false
  # Plaintext listeners the nodes open for the proxy when it is enabled. The
  # proxy terminates client TLS, and only proxy pods can reach these.
  internalPorts:
    bolt: 7688
    http: 8444
  rustLog: info
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  # Destinations for the EndpointSlice watch (the Kubernetes API). Empty allows
  # any destination on 443/6443 for proxy pods only.
  apiServerEgressTo: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  extraEnv: []
  resources:
    requests:
      cpu: "1"
      memory: 256Mi
    limits:
      cpu: "4"
      memory: 1Gi
  service:
    # Defaults to <fullname>-proxy, i.e. turbolay-<env>-proxy.
    name: ""
    type: ClusterIP
    annotations: {}
    loadBalancerSourceRanges: []
    bolt:
      port: 7687
    https:
      port: 443

podDisruptionBudget:
  enabled: true
  # maxUnavailable (when set) takes precedence over minAvailable per component.
  # Prefer maxUnavailable: 1 for the quorum DB so only one member is voluntarily
  # disrupted at a time (majority preserved during drains/upgrades).
  node:
    minAvailable: 1
    maxUnavailable: null
  indexer:
    minAvailable: 1
    maxUnavailable: null

networkPolicy:
  enabled: true
  clientIngressFrom: []
  httpsEgressTo: []
  monitoringNamespaceSelector:
    matchLabels:
      graph.hydradb.io/monitoring-access: "true"
  additionalEgress: []

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 5s
  labels: {}

tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.14.1"
    pullPolicy: IfNotPresent

extraObjects: []

usageReport:
  # Sends the anonymous usage report described in crates/usage-report/README.md.
  enabled: true
