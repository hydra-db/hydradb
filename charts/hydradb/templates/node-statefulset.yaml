apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hydradb.fullname" . }}-node
  labels:
    {{- include "hydradb.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  serviceName: {{ include "hydradb.fullname" . }}-node-headless
  replicas: {{ .Values.node.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: {{ .Values.node.updateStrategy }}
    {{- if eq .Values.node.updateStrategy "RollingUpdate" }}
    rollingUpdate:
      partition: {{ .Values.node.rollingUpdatePartition }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "hydradb.componentLabels" (dict "root" . "component" "node") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hydradb.componentLabels" (dict "root" . "component" "node") | nindent 8 }}
        {{- with .Values.node.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- $reloadSecrets := list (include "hydradb.authSecretName" .) (include "hydradb.publicTlsSecretName" .) }}
        {{- with include "hydradb.peerCaSecretName" . }}
        {{- /* Nodes read the peer CA once, at startup: a rotation needs a restart. */}}
        {{- $reloadSecrets = append $reloadSecrets . }}
        {{- end }}
        secret.reloader.stakater.com/reload: {{ join "," $reloadSecrets | quote }}
        {{- with .Values.node.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hydradb.nodeServiceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.node.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.node.affinity }}
      affinity:
        {{- toYaml .Values.node.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "hydradb.componentLabels" (dict "root" . "component" "node") | nindent 20 }}
      {{- end }}
      {{- if .Values.node.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.node.topologySpreadConstraints | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "hydradb.componentLabels" (dict "root" . "component" "node") | nindent 14 }}
      {{- end }}
      containers:
        - name: graph-node
          image: {{ include "hydradb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.node.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.node.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "hydradb.fullname" . }}-runtime
          env:
            - name: GRAPH_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.proxy.enabled }}
            # Plaintext listeners for the proxy, which terminates client TLS
            # itself. The network policy lets only proxy pods reach them.
            - name: GRAPH_BOLT_INTERNAL_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.proxy.internalPorts.bolt | quote }}
            - name: GRAPH_HTTP_INTERNAL_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.proxy.internalPorts.http | quote }}
            {{- end }}
            {{- with .Values.node.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: bolt
              containerPort: 7687
            - name: https
              containerPort: 8443
            - name: admin
              containerPort: 9090
            {{- if .Values.proxy.enabled }}
            - name: bolt-internal
              containerPort: {{ .Values.proxy.internalPorts.bolt }}
            - name: http-internal
              containerPort: {{ .Values.proxy.internalPorts.http }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /livez
              port: admin
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/slatedb
            - name: tmp
              mountPath: /tmp
            - name: auth
              mountPath: /var/run/secrets/hydradb
              readOnly: true
            {{- if .Values.tls.public.enabled }}
            - name: public-tls
              mountPath: /var/run/secrets/hydradb/public
              readOnly: true
            {{- end }}
            {{- if include "hydradb.peerCaSecretName" . }}
            - name: peer-ca
              mountPath: /var/run/secrets/hydradb/peer-ca
              readOnly: true
            {{- end }}
      volumes:
        {{- if eq .Values.node.cache.type "emptyDir" }}
        - name: cache
          emptyDir:
            {{- with .Values.node.cache.emptyDir.medium }}
            medium: {{ . | quote }}
            {{- end }}
            sizeLimit: {{ .Values.node.cache.emptyDir.sizeLimit }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.node.tmpSizeLimit }}
        - name: auth
          secret:
            secretName: {{ include "hydradb.authSecretName" . }}
            items:
              - key: {{ .Values.auth.secretKey }}
                path: {{ .Values.auth.secretKey }}
        {{- if .Values.tls.public.enabled }}
        - name: public-tls
          secret:
            secretName: {{ include "hydradb.publicTlsSecretName" . }}
        {{- end }}
        {{- with include "hydradb.peerCaSecretName" . }}
        - name: peer-ca
          secret:
            secretName: {{ . }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
  {{- if eq .Values.node.cache.type "persistentVolume" }}
  volumeClaimTemplates:
    - metadata:
        name: cache
        {{- with .Values.node.cache.persistentVolume.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.node.cache.persistentVolume.accessModes | nindent 10 }}
        {{- with .Values.node.cache.persistentVolume.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.node.cache.persistentVolume.size }}
  {{- end }}
