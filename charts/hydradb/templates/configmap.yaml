apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hydradb.fullname" . }}-runtime
  labels:
    {{- include "hydradb.labels" . | nindent 4 }}
data:
  CLOUD_PROVIDER: {{ .Values.objectStore.cloudProvider | quote }}
  AWS_BUCKET_NAME: {{ required "objectStore.aws.bucketName is required" .Values.objectStore.aws.bucketName | quote }}
  AWS_DEFAULT_REGION: {{ .Values.objectStore.aws.region | quote }}
  AWS_ALLOW_HTTP: {{ .Values.objectStore.aws.allowHttp | quote }}
  {{- with .Values.objectStore.aws.endpoint }}
  AWS_ENDPOINT: {{ . | quote }}
  {{- end }}
  GRAPH_NAMESPACE: {{ .Values.graph.namespace | quote }}
  GRAPH_ID: {{ .Values.graph.graphId | quote }}
  GRAPH_DATABASE: {{ .Values.graph.database | quote }}
  GRAPH_CELL_ID: {{ first .Values.graph.cells | quote }}
  GRAPH_CELLS: {{ join "," .Values.graph.cells | quote }}
  GRAPH_DATA_PATH: {{ .Values.graph.dataPath | quote }}
  GRAPH_DATA_CACHE_DIR: /var/cache/slatedb/data
  GRAPH_DATA_CACHE_BYTES: {{ include "hydradb.decimalInteger" .Values.node.cache.memoryLimitBytes | quote }}
  GRAPH_DATA_CACHE_MAX_OPEN_FILES: {{ include "hydradb.decimalInteger" .Values.runtime.dataCacheMaxOpenFiles | quote }}
  GRAPH_SLATE_DB_CACHE_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.slatedbCacheBytes | quote }}
  GRAPH_WAL_FLUSH_INTERVAL_MS: {{ include "hydradb.decimalInteger" .Values.runtime.walFlushIntervalMs | quote }}
  GRAPH_L0_SST_SIZE_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.l0SstSizeBytes | quote }}
  GRAPH_MAX_UNFLUSHED_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.maxUnflushedBytes | quote }}
  GRAPH_MAX_WAL_FLUSHES_BEFORE_L0_FLUSH: {{ include "hydradb.decimalInteger" .Values.runtime.maxWalFlushesBeforeL0Flush | quote }}
  GRAPH_L0_FLUSH_PARALLELISM: {{ include "hydradb.decimalInteger" .Values.runtime.l0FlushParallelism | quote }}
  GRAPH_MAX_MATRIX_ADJACENCIES: {{ include "hydradb.decimalInteger" .Values.runtime.maxMatrixAdjacencies | quote }}
  GRAPH_MAX_MATRIX_ADJACENCY_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.maxMatrixAdjacencyBytes | quote }}
  GRAPH_MAX_GRAPHBLAS_MATRICES: {{ include "hydradb.decimalInteger" .Values.runtime.maxGraphblasMatrices | quote }}
  GRAPH_MAX_GRAPHBLAS_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.maxGraphblasBytes | quote }}
  GRAPH_MAX_RELATIONSHIP_ROWS_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.maxRelationshipRowsBytes | quote }}
  GRAPH_MAX_SOURCE_RELATIONSHIP_ROWS_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.maxSourceRelationshipRowsBytes | quote }}
  GRAPH_MAX_RELATIONSHIP_PROPERTY_ROWS_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.maxRelationshipPropertyRowsBytes | quote }}
  GRAPH_MAX_NATIVE_PATH_RESULT_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.maxNativePathResultBytes | quote }}
  GRAPH_MAX_CONCURRENT_HYDRATIONS: {{ include "hydradb.decimalInteger" .Values.runtime.maxConcurrentHydrations | quote }}
  GRAPH_MAX_CONCURRENT_MATRIX_COMPILATIONS: {{ include "hydradb.decimalInteger" .Values.runtime.maxConcurrentMatrixCompilations | quote }}
  GRAPH_INDEX_DISCOVERY_INTERVAL_MS: {{ include "hydradb.decimalInteger" .Values.runtime.indexDiscoveryIntervalMs | quote }}
  GRAPH_WRITER_LEASE_MS: {{ include "hydradb.decimalInteger" .Values.runtime.writerLeaseMs | quote }}
  GRAPH_INDEXER_INTERVAL_MS: {{ include "hydradb.decimalInteger" .Values.indexer.intervalMs | quote }}
  GRAPH_INDEXER_DIRTY_POLL_INTERVAL_MS: {{ include "hydradb.decimalInteger" .Values.indexer.dirtyPollIntervalMs | quote }}
  GRAPH_INDEXER_RETAIN_PREVIOUS: {{ include "hydradb.decimalInteger" .Values.indexer.retainPreviousGenerations | quote }}
  GRAPH_INDEXER_BUILD_MODE: {{ .Values.indexer.buildMode | quote }}
  GRAPH_INDEXER_INCREMENTAL_MIN_EDGES: {{ include "hydradb.decimalInteger" .Values.indexer.incrementalMinEdges | quote }}
  GRAPH_INDEXER_SCOPE_CONCURRENCY: {{ include "hydradb.decimalInteger" .Values.indexer.scopeConcurrency | quote }}
  GRAPH_INDEXER_SCOPES_PER_CYCLE: {{ include "hydradb.decimalInteger" .Values.indexer.scopesPerCycle | quote }}
  GRAPH_INDEXER_MAX_OPEN_SCOPES: {{ include "hydradb.decimalInteger" .Values.indexer.maxOpenScopes | quote }}
  GRAPH_INDEXER_READINESS_FAILURE_THRESHOLD: {{ include "hydradb.decimalInteger" .Values.indexer.readinessFailureThreshold | quote }}
  GRAPH_INDEXER_MAX_TAIL_FILES: {{ include "hydradb.decimalInteger" .Values.indexer.maxWalTailFiles | quote }}
  GRAPH_WAL_TAIL_FETCH_CONCURRENCY: {{ include "hydradb.decimalInteger" .Values.indexer.walTailFetchConcurrency | quote }}
  GRAPH_INDEXER_ADMIN_ADDR: "0.0.0.0:9091"
  {{- if .Values.indexer.enabled }}
  GRAPH_INDEXER_NOTIFY_URL: {{ printf "http://%s-indexer-metrics.%s.svc.cluster.local:9091/v1/changes:process" (include "hydradb.fullname" .) .Release.Namespace | quote }}
  {{- else }}
  GRAPH_INDEXER_NOTIFY_URL: ""
  {{- end }}
  GRAPH_BOLT_ADDR: 0.0.0.0:7687
  GRAPH_HTTP_ADDR: 0.0.0.0:8443
  GRAPH_ADMIN_ADDR: 0.0.0.0:9090
  GRAPH_ADVERTISED_BOLT_ADDR: {{ include "hydradb.advertisedBoltAddress" . | quote }}
  GRAPH_BOLT_NODE_ADDRESSES: {{ include "hydradb.nodeAddresses" . | quote }}
  GRAPH_AUTH_TOKEN_FILE: "/var/run/secrets/hydradb/{{ .Values.auth.secretKey }}"
  GRAPH_TLS_CERTIFICATE: /var/run/secrets/hydradb/public/tls.crt
  GRAPH_TLS_PRIVATE_KEY: /var/run/secrets/hydradb/public/tls.key
  GRAPH_ALLOW_PLAINTEXT: {{ not .Values.tls.public.enabled | quote }}
  GRAPH_MAX_OPEN_SCOPES: {{ include "hydradb.decimalInteger" .Values.runtime.maxOpenScopes | quote }}
  GRAPH_READER_WAL_REPLAY_CONCURRENCY: {{ include "hydradb.decimalInteger" .Values.runtime.readerWalReplayConcurrency | quote }}
  GRAPH_MAX_CONCURRENT_QUERIES: {{ include "hydradb.decimalInteger" .Values.runtime.maxConcurrentQueries | quote }}
  GRAPH_MAX_QUERY_SCAN_EDGES: {{ include "hydradb.decimalInteger" .Values.runtime.maxQueryScanEdges | quote }}
  GRAPH_MAX_QUERY_RUNTIME_MS: {{ include "hydradb.decimalInteger" .Values.runtime.maxQueryRuntimeMs | quote }}
  GRAPH_MAX_SERVER_CURSORS: {{ include "hydradb.decimalInteger" .Values.runtime.maxServerCursors | quote }}
  GRAPH_MAX_CURSOR_BUFFER_BYTES: {{ include "hydradb.decimalInteger" .Values.runtime.maxCursorBufferBytes | quote }}
  GRAPH_CURSOR_TTL_MS: {{ include "hydradb.decimalInteger" .Values.runtime.cursorTtlMs | quote }}
  GRAPH_MAX_BOLT_CONNECTIONS: {{ include "hydradb.decimalInteger" .Values.runtime.maxBoltConnections | quote }}
  GRAPH_BOLT_AUTHENTICATION_TIMEOUT_MS: {{ include "hydradb.decimalInteger" .Values.runtime.boltAuthenticationTimeoutMs | quote }}
  GRAPH_BOLT_IDLE_TIMEOUT_MS: {{ include "hydradb.decimalInteger" .Values.runtime.boltIdleTimeoutMs | quote }}
  GRAPH_BOLT_MAX_CONNECTION_AGE_MS: {{ include "hydradb.decimalInteger" .Values.runtime.boltMaxConnectionAgeMs | quote }}
  GRAPH_DEFAULT_PAGE_SIZE: {{ include "hydradb.decimalInteger" .Values.runtime.defaultPageSize | quote }}
  GRAPH_GRACEFUL_SHUTDOWN_MS: {{ include "hydradb.decimalInteger" .Values.runtime.gracefulShutdownMs | quote }}
  GRAPH_TRIM_MEMORY_AFTER_HYDRATION: {{ .Values.runtime.trimMemoryAfterHydration | quote }}
  RUST_LOG: {{ .Values.runtime.rustLog | quote }}
