{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "turbolay.fullname" . }}-node
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  {{- if .Values.podDisruptionBudget.node.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.node.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.node.minAvailable }}
  {{- end }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "turbolay.componentLabels" (dict "root" . "component" "node") | nindent 6 }}
{{- end }}
{{- if and .Values.podDisruptionBudget.enabled .Values.indexer.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "turbolay.fullname" . }}-indexer
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  {{- if .Values.podDisruptionBudget.indexer.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.indexer.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.indexer.minAvailable }}
  {{- end }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "turbolay.componentLabels" (dict "root" . "component" "indexer") | nindent 6 }}
{{- end }}
