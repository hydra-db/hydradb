{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "turbolay.fullname" . }}-service-discovery
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "turbolay.fullname" . }}-node-role-publisher
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames:
      {{- $fullname := include "turbolay.fullname" . }}
      {{- range $index := until (int .Values.node.replicaCount) }}
      - {{ printf "%s-node-%d" $fullname $index }}
      {{- end }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "turbolay.fullname" . }}-node-role-publisher
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "turbolay.fullname" . }}-node-role-publisher
subjects:
  - kind: ServiceAccount
    name: {{ include "turbolay.nodeServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "turbolay.fullname" . }}-service-discovery
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "turbolay.fullname" . }}-service-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "turbolay.nodeServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
