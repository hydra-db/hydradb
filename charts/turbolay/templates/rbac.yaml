{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "turbolay.fullname" . }}-service-discovery
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "turbolay.fullname" . }}-service-discovery
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "turbolay.fullname" . }}-service-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "turbolay.nodeServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
