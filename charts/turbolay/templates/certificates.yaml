{{- if and .Values.tls.certManager.enabled .Values.tls.public.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "turbolay.fullname" . }}-server
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
spec:
  secretName: {{ include "turbolay.publicTlsSecretName" . }}
  duration: {{ .Values.tls.certManager.publicDuration }}
  renewBefore: {{ .Values.tls.certManager.publicRenewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - {{ include "turbolay.fullname" . }}-bolt.{{ .Release.Namespace }}.svc
    - {{ include "turbolay.fullname" . }}-bolt.{{ .Release.Namespace }}.svc.cluster.local
    - {{ include "turbolay.fullname" . }}-https.{{ .Release.Namespace }}.svc
    - {{ include "turbolay.fullname" . }}-https.{{ .Release.Namespace }}.svc.cluster.local
    {{- range .Values.tls.public.additionalDnsNames }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    group: {{ .Values.tls.certManager.publicIssuerRef.group }}
    kind: {{ .Values.tls.certManager.publicIssuerRef.kind }}
    name: {{ required "tls.certManager.publicIssuerRef.name is required" .Values.tls.certManager.publicIssuerRef.name }}
{{- end }}
{{- if and .Values.tls.certManager.enabled .Values.tls.internal.enabled }}
{{- if and .Values.tls.certManager.enabled .Values.tls.public.enabled }}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "turbolay.fullname" . }}-internal-ca
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
spec:
  secretName: {{ include "turbolay.internalCaSecretName" . }}
  duration: {{ .Values.tls.certManager.internalCaDuration }}
  renewBefore: {{ .Values.tls.certManager.internalCaRenewBefore }}
  isCA: true
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
    - digital signature
  commonName: {{ include "turbolay.fullname" . }}-internal-ca
  issuerRef:
    group: {{ .Values.tls.certManager.internalRootIssuerRef.group }}
    kind: {{ .Values.tls.certManager.internalRootIssuerRef.kind }}
    name: {{ required "tls.certManager.internalRootIssuerRef.name is required" .Values.tls.certManager.internalRootIssuerRef.name }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "turbolay.fullname" . }}-internal-ca
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "turbolay.internalCaSecretName" . }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "turbolay.fullname" . }}-controller-mtls
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
spec:
  secretName: {{ include "turbolay.controllerTlsSecretName" . }}
  duration: {{ .Values.tls.certManager.internalLeafDuration }}
  renewBefore: {{ .Values.tls.certManager.internalLeafRenewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - {{ include "turbolay.fullname" . }}-controller.{{ .Release.Namespace }}.svc
    - {{ include "turbolay.fullname" . }}-controller.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ include "turbolay.fullname" . }}-internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "turbolay.fullname" . }}-node-mtls
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
spec:
  secretName: {{ include "turbolay.nodeTlsSecretName" . }}
  duration: {{ .Values.tls.certManager.internalLeafDuration }}
  renewBefore: {{ .Values.tls.certManager.internalLeafRenewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - client auth
  commonName: {{ include "turbolay.fullname" . }}-node
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ include "turbolay.fullname" . }}-internal-ca
{{- end }}
