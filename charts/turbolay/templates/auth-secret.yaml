{{- if and .Values.auth.create (not .Values.auth.existingSecret) (not .Values.auth.externalSecret.enabled) }}
{{- $name := include "turbolay.authSecretName" . -}}
{{- $token := default (randAlphaNum 48) .Values.auth.token -}}
{{- if and .Values.auth.preserveGeneratedToken .Release.IsUpgrade -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
  {{- if and $existing (hasKey $existing.data .Values.auth.secretKey) -}}
    {{- $token = index $existing.data .Values.auth.secretKey | b64dec -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ $token | quote }}
{{- end }}
