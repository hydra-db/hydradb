{{- if and (not .Values.auth.create) (not .Values.auth.existingSecret) (not .Values.auth.externalSecret.enabled) -}}
{{- fail "configure one client-auth source: auth.create, auth.existingSecret, or auth.externalSecret.enabled" -}}
{{- end -}}
{{- if and .Values.auth.existingSecret .Values.auth.externalSecret.enabled -}}
{{- fail "auth.existingSecret and auth.externalSecret.enabled are mutually exclusive" -}}
{{- end -}}
{{- if and .Values.tls.certManager.enabled (not .Values.tls.public.enabled) (not .Values.tls.internal.enabled) -}}
{{- fail "tls.certManager.enabled requires public TLS or internal mTLS" -}}
{{- end -}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.podDisruptionBudget.node.minAvailable) (int .Values.node.replicaCount)) -}}
{{- fail "podDisruptionBudget.node.minAvailable cannot exceed node.replicaCount" -}}
{{- end -}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.podDisruptionBudget.controller.minAvailable) (int .Values.controller.replicaCount)) -}}
{{- fail "podDisruptionBudget.controller.minAvailable cannot exceed controller.replicaCount" -}}
{{- end -}}
