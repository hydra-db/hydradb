{{- if and (not .Values.auth.create) (not .Values.auth.existingSecret) (not .Values.auth.externalSecret.enabled) -}}
{{- fail "configure one client-auth source: auth.create, auth.existingSecret, or auth.externalSecret.enabled" -}}
{{- end -}}
{{- if and .Values.auth.existingSecret .Values.auth.externalSecret.enabled -}}
{{- fail "auth.existingSecret and auth.externalSecret.enabled are mutually exclusive" -}}
{{- end -}}
{{- if and .Values.tls.certManager.enabled (not .Values.tls.public.enabled) -}}
{{- fail "tls.certManager.enabled requires public TLS" -}}
{{- end -}}
{{- if ne (len .Values.graph.cells) 1 -}}
{{- fail "the production runtime currently exposes exactly one cell per graph scope; deploy another release for another independently writable scope" -}}
{{- end -}}
{{- if and .Values.tls.public.trustBundle.enabled (not .Values.tls.public.enabled) -}}
{{- fail "tls.public.trustBundle.enabled requires public TLS" -}}
{{- end -}}
{{- if and .Values.tls.public.trustBundle.enabled (empty .Values.tls.public.trustBundle.namespaceSelector) -}}
{{- fail "tls.public.trustBundle.namespaceSelector must explicitly select client namespaces" -}}
{{- end -}}
{{- if and .Values.networkPolicy.enabled (empty .Values.networkPolicy.httpsEgressTo) -}}
{{- fail "networkPolicy.httpsEgressTo must restrict AWS S3 and STS HTTPS egress to private endpoint selectors or non-universal CIDRs" -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
{{- range $index, $peer := .Values.networkPolicy.httpsEgressTo -}}
{{- if not (or (hasKey $peer "ipBlock") (hasKey $peer "namespaceSelector") (hasKey $peer "podSelector")) -}}
{{- fail (printf "networkPolicy.httpsEgressTo[%d] must define ipBlock, namespaceSelector, or podSelector" $index) -}}
{{- end -}}
{{- if hasKey $peer "ipBlock" -}}
{{- $cidr := get (get $peer "ipBlock") "cidr" | default "" -}}
{{- if or (empty $cidr) (eq $cidr "0.0.0.0/0") (eq $cidr "::/0") -}}
{{- fail (printf "networkPolicy.httpsEgressTo[%d].ipBlock.cidr must be a non-universal CIDR" $index) -}}
{{- end -}}
{{- end -}}
{{- range $selectorName := list "namespaceSelector" "podSelector" -}}
{{- if hasKey $peer $selectorName -}}
{{- $selector := get $peer $selectorName -}}
{{- if and (empty (get $selector "matchLabels")) (empty (get $selector "matchExpressions")) -}}
{{- fail (printf "networkPolicy.httpsEgressTo[%d].%s must contain non-empty matchLabels or matchExpressions" $index $selectorName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.networkPolicy.enabled .Values.objectStore.aws.endpoint (empty .Values.objectStore.aws.endpointEgressTo) -}}
{{- fail "objectStore.aws.endpointEgressTo must restrict every custom object-store endpoint to a namespace, Pod selector, or CIDR" -}}
{{- end -}}
{{- if and .Values.networkPolicy.enabled .Values.objectStore.aws.endpoint -}}
{{- range $index, $peer := .Values.objectStore.aws.endpointEgressTo -}}
{{- if not (or (hasKey $peer "ipBlock") (hasKey $peer "namespaceSelector") (hasKey $peer "podSelector")) -}}
{{- fail (printf "objectStore.aws.endpointEgressTo[%d] must define ipBlock, namespaceSelector, or podSelector" $index) -}}
{{- end -}}
{{- if hasKey $peer "ipBlock" -}}
{{- $cidr := get (get $peer "ipBlock") "cidr" | default "" -}}
{{- if or (empty $cidr) (eq $cidr "0.0.0.0/0") (eq $cidr "::/0") -}}
{{- fail (printf "objectStore.aws.endpointEgressTo[%d].ipBlock.cidr must restrict the endpoint to a non-universal CIDR" $index) -}}
{{- end -}}
{{- end -}}
{{- range $selectorName := list "namespaceSelector" "podSelector" -}}
{{- if hasKey $peer $selectorName -}}
{{- $selector := get $peer $selectorName -}}
{{- if and (empty (get $selector "matchLabels")) (empty (get $selector "matchExpressions")) -}}
{{- fail (printf "objectStore.aws.endpointEgressTo[%d].%s must contain non-empty matchLabels or matchExpressions" $index $selectorName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
{{- range $index, $peer := .Values.networkPolicy.clientIngressFrom -}}
{{- range $selectorName := list "namespaceSelector" "podSelector" -}}
{{- if hasKey $peer $selectorName -}}
{{- $selector := get $peer $selectorName -}}
{{- if and (empty (get $selector "matchLabels")) (empty (get $selector "matchExpressions")) -}}
{{- fail (printf "networkPolicy.clientIngressFrom[%d].%s must contain non-empty matchLabels or matchExpressions" $index $selectorName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.podDisruptionBudget.node.minAvailable) (int .Values.node.replicaCount)) -}}
{{- fail "podDisruptionBudget.node.minAvailable cannot exceed node.replicaCount" -}}
{{- end -}}
{{- if and .Values.podDisruptionBudget.enabled .Values.indexer.enabled (gt (int .Values.podDisruptionBudget.indexer.minAvailable) (int .Values.indexer.replicaCount)) -}}
{{- fail "podDisruptionBudget.indexer.minAvailable cannot exceed indexer.replicaCount" -}}
{{- end -}}
