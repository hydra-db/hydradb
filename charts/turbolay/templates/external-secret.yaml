{{- if .Values.auth.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "turbolay.authSecretName" . }}
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.auth.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.auth.externalSecret.secretStoreRef.kind }}
    name: {{ required "auth.externalSecret.secretStoreRef.name is required when External Secrets is enabled" .Values.auth.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "turbolay.authSecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: {{ .Values.auth.secretKey }}
      remoteRef:
        key: {{ required "auth.externalSecret.remoteRef.key is required" .Values.auth.externalSecret.remoteRef.key }}
        property: {{ .Values.auth.externalSecret.remoteRef.property }}
{{- end }}
