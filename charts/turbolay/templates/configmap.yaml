apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "turbolay.fullname" . }}-runtime
  labels:
    {{- include "turbolay.labels" . | nindent 4 }}
data:
  CLOUD_PROVIDER: {{ .Values.objectStore.cloudProvider | quote }}
  AWS_BUCKET_NAME: {{ required "objectStore.aws.bucketName is required" .Values.objectStore.aws.bucketName | quote }}
  AWS_DEFAULT_REGION: {{ .Values.objectStore.aws.region | quote }}
  AWS_ALLOW_HTTP: {{ .Values.objectStore.aws.allowHttp | quote }}
  {{- with .Values.objectStore.aws.endpoint }}
  AWS_ENDPOINT: {{ . | quote }}
  {{- end }}
  GRAPH_NAMESPACE: {{ .Values.graph.namespace | quote }}
  GRAPH_ID: {{ .Values.graph.graphId | quote }}
  GRAPH_DATABASE: {{ .Values.graph.database | quote }}
  GRAPH_CELL_ID: {{ first .Values.graph.cells | quote }}
  GRAPH_CELLS: {{ join "," .Values.graph.cells | quote }}
  GRAPH_CONTROL_PATH: {{ .Values.graph.controlPath | quote }}
  GRAPH_DATA_PATH: {{ .Values.graph.dataPath | quote }}
  GRAPH_CONTROL_CACHE_DIR: /var/cache/slatedb/control
  GRAPH_DATA_CACHE_DIR: /var/cache/slatedb/data
  GRAPH_CONTROL_CACHE_BYTES: {{ .Values.controller.cache.memoryLimitBytes | quote }}
  GRAPH_DATA_CACHE_BYTES: {{ .Values.node.cache.memoryLimitBytes | quote }}
  GRAPH_L0_SST_SIZE_BYTES: {{ .Values.runtime.l0SstSizeBytes | quote }}
  GRAPH_MAX_UNFLUSHED_BYTES: {{ .Values.runtime.maxUnflushedBytes | quote }}
  GRAPH_MAX_WAL_FLUSHES_BEFORE_L0_FLUSH: {{ .Values.runtime.maxWalFlushesBeforeL0Flush | quote }}
  GRAPH_L0_FLUSH_PARALLELISM: {{ .Values.runtime.l0FlushParallelism | quote }}
  GRAPH_MAX_MATRIX_ADJACENCIES: {{ .Values.runtime.maxMatrixAdjacencies | quote }}
  GRAPH_MAX_MATRIX_ADJACENCY_BYTES: {{ .Values.runtime.maxMatrixAdjacencyBytes | quote }}
  GRAPH_MAX_GRAPHBLAS_MATRICES: {{ .Values.runtime.maxGraphblasMatrices | quote }}
  GRAPH_MAX_GRAPHBLAS_BYTES: {{ .Values.runtime.maxGraphblasBytes | quote }}
  GRAPH_MAX_POSTING_CHUNK_BYTES: {{ .Values.runtime.maxPostingChunkBytes | quote }}
  GRAPH_MAX_MATERIALIZED_SUPERNODE_BYTES: {{ .Values.runtime.maxMaterializedSupernodeBytes | quote }}
  GRAPH_MAX_CONCURRENT_HYDRATIONS: {{ .Values.runtime.maxConcurrentHydrations | quote }}
  GRAPH_MAX_CONCURRENT_MATRIX_COMPILATIONS: {{ .Values.runtime.maxConcurrentMatrixCompilations | quote }}
  GRAPH_LEASE_TTL_MS: {{ .Values.runtime.leaseTtlMs | quote }}
  GRAPH_LEASE_RENEW_INTERVAL_MS: {{ .Values.runtime.leaseRenewIntervalMs | quote }}
  GRAPH_SHARD_REFRESH_INTERVAL_MS: {{ .Values.runtime.shardRefreshIntervalMs | quote }}
  GRAPH_HEARTBEAT_TTL_MS: {{ .Values.runtime.heartbeatTtlMs | quote }}
  GRAPH_CONTROLLER_INTERVAL_MS: {{ .Values.runtime.controllerIntervalMs | quote }}
  GRAPH_REBALANCE_MODE: {{ .Values.runtime.rebalanceMode | quote }}
  GRAPH_BOLT_ADDR: 0.0.0.0:7687
  GRAPH_HTTP_ADDR: 0.0.0.0:8443
  GRAPH_ADMIN_ADDR: 0.0.0.0:9090
  GRAPH_ADVERTISED_BOLT_ADDR: {{ include "turbolay.advertisedBoltAddress" . | quote }}
  GRAPH_BOLT_NODE_ADDRESSES: {{ include "turbolay.nodeAddresses" . | quote }}
  GRAPH_AUTH_TOKEN_FILE: "/var/run/secrets/turbolay/{{ .Values.auth.secretKey }}"
  GRAPH_TLS_CERTIFICATE: /var/run/secrets/turbolay/public/tls.crt
  GRAPH_TLS_PRIVATE_KEY: /var/run/secrets/turbolay/public/tls.key
  GRAPH_ALLOW_PLAINTEXT: {{ not .Values.tls.public.enabled | quote }}
  GRAPH_MAX_CONCURRENT_QUERIES: {{ .Values.runtime.maxConcurrentQueries | quote }}
  GRAPH_MAX_QUERY_RUNTIME_MS: {{ .Values.runtime.maxQueryRuntimeMs | quote }}
  GRAPH_MAX_BOLT_CONNECTIONS: {{ .Values.runtime.maxBoltConnections | quote }}
  GRAPH_DEFAULT_PAGE_SIZE: {{ .Values.runtime.defaultPageSize | quote }}
  GRAPH_GRACEFUL_SHUTDOWN_MS: {{ .Values.runtime.gracefulShutdownMs | quote }}
  GRAPH_RUNTIME_LEASE_TTL_MS: {{ .Values.runtime.runtimeLeaseTtlMs | quote }}
  GRAPH_RUNTIME_LEASE_RENEW_INTERVAL_MS: {{ .Values.runtime.runtimeLeaseRenewIntervalMs | quote }}
  GRAPH_CONTROL_RPC_ADDR: 0.0.0.0:9443
  GRAPH_CONTROL_RPC_ENDPOINT: {{ include "turbolay.controlEndpoint" . | quote }}
  GRAPH_CONTROL_RPC_SERVER_NAME: {{ include "turbolay.controlServerName" . | quote }}
  GRAPH_INTERNAL_TLS_CERTIFICATE: /var/run/secrets/turbolay/internal/tls.crt
  GRAPH_INTERNAL_TLS_PRIVATE_KEY: /var/run/secrets/turbolay/internal/tls.key
  GRAPH_INTERNAL_TLS_CA: /var/run/secrets/turbolay/internal/ca.crt
  GRAPH_INTERNAL_ALLOW_PLAINTEXT: {{ not .Values.tls.internal.enabled | quote }}
  GRAPH_TRIM_MEMORY_AFTER_HYDRATION: {{ .Values.runtime.trimMemoryAfterHydration | quote }}
  GRAPH_KUBERNETES_ROLE_LABELS: "true"
  RUST_LOG: {{ .Values.runtime.rustLog | quote }}
