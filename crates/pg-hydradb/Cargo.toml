[package]
name = "pg-hydradb"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "PostgreSQL adapter for HydraDB's replaceable graph execution ports"
license = "Elastic-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[features]
default = ["pg16"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]

# pgrx's `pg_shmem_init!` names every PostgreSQL version in its cfgs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("pg13", "pg14", "pg15", "pg19"))'] }

[dependencies]
pgrx = "=0.19.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hydradb-pg-graph-core = { path = "../pg-graph-core" }
hydradb-pg-graph-csr = { path = "../pg-graph-csr" }
hydradb-pg-graph-query = { path = "../pg-graph-query" }
hydradb-pg-usage-report = { path = "../pg-usage-report" }
# Sends the usage report from the background worker: blocking, no async
# runtime in the server process, rustls with bundled roots.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
