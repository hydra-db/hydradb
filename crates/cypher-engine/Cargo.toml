[package]
name = "hydradb-cypher-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Isolated Cypher preparation and graph physical-plan execution"
publish = false

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hydradb-cypher-ast = { path = "../cypher-ast" }
hydradb-cypher-date = { path = "../cypher-date" }
indexmap = { workspace = true }
hydradb-cypher-parser-antlr = { path = "../cypher-parser-antlr" }
thiserror = { workspace = true }
tokio = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

