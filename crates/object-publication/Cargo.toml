[package]
name = "hydradb-object-publication"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Lease-owned, forward-only publication of derived objects in object storage"
publish = false

# No dependency on `hydradb`: this crate knows about owners, leases, sequences
# and payloads, not about graphs, scopes or statistics. That is what keeps it
# testable against `InMemory` alone and reusable by the index manifest.
#
# `slatedb` is here for the `slatedb::object_store` re-export, as in
# `crates/placement`: `Arc<dyn ObjectStore>` only unifies across the crate
# boundary when both sides name the same one. `slatedb-txn-obj` is the fork's
# transactional-object primitive (versioned read, conditional write, retry on
# conflict); the single-object ETag protocol below is this crate's adapter to it.
[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
slatedb = { workspace = true }
slatedb-common = { workspace = true }
slatedb-txn-obj = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
slatedb-common = { workspace = true, features = ["test-util"] }
tokio = { workspace = true }
