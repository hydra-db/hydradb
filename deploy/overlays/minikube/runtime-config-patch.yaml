apiVersion: v1
kind: ConfigMap
metadata:
  name: graph-runtime-config
data:
  AWS_BUCKET_NAME: graph-data
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT: http://minio:9000
  AWS_ALLOW_HTTP: "true"
  AWS_ACCESS_KEY_ID: graph-minio
  AWS_SECRET_ACCESS_KEY: graph-minio-development-password
  GRAPH_NAMESPACE: minikube
  GRAPH_ALLOW_PLAINTEXT: "true"
  GRAPH_INTERNAL_ALLOW_PLAINTEXT: "true"
  GRAPH_ADVERTISED_BOLT_ADDR: graph-bolt.slatedb-graph.svc.cluster.local:7687
  GRAPH_CONTROL_CACHE_BYTES: "134217728"
  GRAPH_DATA_CACHE_BYTES: "1073741824"
  RUST_LOG: info,slatedb_graph_kernel=debug
