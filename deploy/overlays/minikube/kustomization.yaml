apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: slatedb-graph
resources:
  - ../../base
  - minio.yaml
patches:
  - path: runtime-config-patch.yaml
  - path: node-patch.yaml
  - path: controller-patch.yaml
  - path: network-policy-patch.yaml
secretGenerator:
  - name: graph-client-auth
    literals:
      - auth-token=minikube-development-token-32-characters
  - name: minio-credentials
    literals:
      - root-user=graph-minio
      - root-password=graph-minio-development-password
  - name: graph-controller-mtls
    literals:
      - tls.crt=unused-in-plaintext-minikube
      - tls.key=unused-in-plaintext-minikube
      - ca.crt=unused-in-plaintext-minikube
  - name: graph-node-mtls
    literals:
      - tls.crt=unused-in-plaintext-minikube
      - tls.key=unused-in-plaintext-minikube
      - ca.crt=unused-in-plaintext-minikube
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: ghcr.io/usecortex/slatedb-graph-kernel
    newName: slatedb-graph-kernel
    newTag: dev
