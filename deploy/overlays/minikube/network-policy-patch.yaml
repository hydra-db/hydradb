apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: graph-runtime-traffic
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 7687
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9090
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
