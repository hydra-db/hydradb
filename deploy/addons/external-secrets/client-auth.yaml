apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: graph-client-auth
  namespace: slatedb-graph
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: REPLACE_AWS_SECRETS_MANAGER_STORE
  target:
    name: graph-client-auth
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: auth-token
      remoteRef:
        key: slatedb-graph/client-auth
        property: token
