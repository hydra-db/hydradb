apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: graph-default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: graph-runtime-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: slatedb-graph
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 7687
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: node
      ports:
        - protocol: TCP
          port: 9443
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              graph.usecortex.io/monitoring-access: "true"
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 7687
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9090
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
