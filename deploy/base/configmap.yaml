apiVersion: v1
kind: ConfigMap
metadata:
  name: graph-runtime-config
data:
  CLOUD_PROVIDER: aws
  AWS_BUCKET_NAME: graph-benchmark
  AWS_DEFAULT_REGION: us-east-1
  GRAPH_NAMESPACE: production
  GRAPH_ID: default
  GRAPH_DATABASE: default
  GRAPH_CELL_ID: cell-0
  GRAPH_CELLS: cell-0
  GRAPH_CONTROL_PATH: slatedb-graph/control
  GRAPH_DATA_PATH: slatedb-graph/data
  GRAPH_CONTROL_CACHE_DIR: /var/cache/slatedb/control
  GRAPH_DATA_CACHE_DIR: /var/cache/slatedb/data
  GRAPH_CONTROL_CACHE_BYTES: "536870912"
  GRAPH_DATA_CACHE_BYTES: "8589934592"
  GRAPH_LEASE_TTL_MS: "30000"
  GRAPH_LEASE_RENEW_INTERVAL_MS: "5000"
  GRAPH_SHARD_REFRESH_INTERVAL_MS: "2000"
  GRAPH_HEARTBEAT_TTL_MS: "20000"
  GRAPH_CONTROLLER_INTERVAL_MS: "2000"
  GRAPH_REBALANCE_MODE: stability-first
  GRAPH_BOLT_ADDR: 0.0.0.0:7687
  GRAPH_HTTP_ADDR: 0.0.0.0:8443
  GRAPH_ADMIN_ADDR: 0.0.0.0:9090
  GRAPH_ADVERTISED_BOLT_ADDR: graph-bolt.slatedb-graph.svc.cluster.local:7687
  GRAPH_BOLT_NODE_ADDRESSES: graph-node-0=graph-node-0.graph-node-headless.slatedb-graph.svc.cluster.local:7687,graph-node-1=graph-node-1.graph-node-headless.slatedb-graph.svc.cluster.local:7687,graph-node-2=graph-node-2.graph-node-headless.slatedb-graph.svc.cluster.local:7687
  GRAPH_AUTH_TOKEN_FILE: /var/run/secrets/slatedb-graph/auth-token
  GRAPH_TLS_CERTIFICATE: /var/run/secrets/slatedb-graph/tls/tls.crt
  GRAPH_TLS_PRIVATE_KEY: /var/run/secrets/slatedb-graph/tls/tls.key
  GRAPH_ALLOW_PLAINTEXT: "false"
  GRAPH_MAX_CONCURRENT_QUERIES: "256"
  GRAPH_MAX_QUERY_RUNTIME_MS: "30000"
  GRAPH_MAX_BOLT_CONNECTIONS: "4096"
  GRAPH_DEFAULT_PAGE_SIZE: "1024"
  GRAPH_GRACEFUL_SHUTDOWN_MS: "30000"
  GRAPH_RUNTIME_LEASE_TTL_MS: "30000"
  GRAPH_RUNTIME_LEASE_RENEW_INTERVAL_MS: "5000"
  GRAPH_CONTROL_RPC_ADDR: 0.0.0.0:9443
  GRAPH_CONTROL_RPC_ENDPOINT: graph-controller.slatedb-graph.svc.cluster.local:9443
  GRAPH_CONTROL_RPC_SERVER_NAME: graph-controller.slatedb-graph.svc.cluster.local
  GRAPH_INTERNAL_TLS_CERTIFICATE: /var/run/secrets/slatedb-graph/internal/tls.crt
  GRAPH_INTERNAL_TLS_PRIVATE_KEY: /var/run/secrets/slatedb-graph/internal/tls.key
  GRAPH_INTERNAL_TLS_CA: /var/run/secrets/slatedb-graph/internal/ca.crt
  GRAPH_INTERNAL_ALLOW_PLAINTEXT: "false"
  GRAPH_TRIM_MEMORY_AFTER_HYDRATION: "true"
  RUST_LOG: info,slatedb_graph_kernel=info
