apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: graph-node
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/component: node
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: graph-controller
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
