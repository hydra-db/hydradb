apiVersion: v1
kind: Secret
metadata:
  name: graph-client-auth
  namespace: slatedb-graph
type: Opaque
stringData:
  auth-token: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
---
apiVersion: v1
kind: Secret
metadata:
  name: graph-server-tls
  namespace: slatedb-graph
type: kubernetes.io/tls
stringData:
  tls.crt: |
    REPLACE_WITH_PEM_CERTIFICATE
  tls.key: |
    REPLACE_WITH_PEM_PRIVATE_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: graph-controller-mtls
  namespace: slatedb-graph
type: Opaque
stringData:
  tls.crt: |
    REPLACE_WITH_INTERNAL_CONTROLLER_SERVER_CERTIFICATE
  tls.key: |
    REPLACE_WITH_INTERNAL_PRIVATE_KEY
  ca.crt: |
    REPLACE_WITH_INTERNAL_CA_CERTIFICATE
---
apiVersion: v1
kind: Secret
metadata:
  name: graph-node-mtls
  namespace: slatedb-graph
type: Opaque
stringData:
  tls.crt: |
    REPLACE_WITH_INTERNAL_NODE_CLIENT_CERTIFICATE
  tls.key: |
    REPLACE_WITH_INTERNAL_NODE_PRIVATE_KEY
  ca.crt: |
    REPLACE_WITH_INTERNAL_CA_CERTIFICATE
