apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: graph-node
spec:
  serviceName: graph-node-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: graph-node
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: node
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: node
      containers:
        - name: graph-node
          image: ghcr.io/usecortex/slatedb-graph-kernel:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: graph-runtime-config
          env:
            - name: GRAPH_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: bolt
              containerPort: 7687
            - name: https
              containerPort: 8443
            - name: admin
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /livez
              port: admin
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 12Gi
            limits:
              cpu: "8"
              memory: 16Gi
              ephemeral-storage: 24Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/slatedb
            - name: tmp
              mountPath: /tmp
            - name: auth
              mountPath: /var/run/secrets/slatedb-graph
              readOnly: true
            - name: tls
              mountPath: /var/run/secrets/slatedb-graph/tls
              readOnly: true
            - name: internal-tls
              mountPath: /var/run/secrets/slatedb-graph/internal
              readOnly: true
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: auth
          secret:
            secretName: graph-client-auth
            items:
              - key: auth-token
                path: auth-token
        - name: tls
          secret:
            secretName: graph-server-tls
            optional: true
        - name: internal-tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: graph-node-mtls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: graph-internal-ca
                  items:
                    - key: tls.crt
                      path: ca.crt
