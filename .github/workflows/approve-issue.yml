name: Approve issue

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  approve:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/approved') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'approved-for-pr';
            const commenter = context.payload.comment.user.login;
            const author = context.payload.issue.user.login;
            const issue_number = context.payload.issue.number;
            const react = (c) => github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: c });
            const reply = (msg) => github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number, body: msg });

            const got = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: '.github/vouched.json' });
            const roster = JSON.parse(Buffer.from(got.data.content, 'base64').toString('utf8'));
            const maintainers = roster.maintainers || [];
            const vouched = roster.vouched || {};

            if (!maintainers.includes(commenter)) {
              await react('-1');
              await reply(`@${commenter} only maintainers can \`/approved\` an issue.`);
              return;
            }
            const isVouched = maintainers.includes(author) || Object.prototype.hasOwnProperty.call(vouched, author);
            if (!isVouched) {
              await react('-1');
              await reply(`This issue cannot be approved yet: its author @${author} has not been vouched. A maintainer must \`/vouch @${author}\` first (see CONTRIBUTING.md).`);
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: LABEL });
            } catch (e) {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: LABEL, color: '0E8A16', description: 'Issue approved by a maintainer; a PR may now be opened.' });
            }
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number, labels: [LABEL] });
            await react('+1');
            await reply(`Approved by @${commenter}. @${author} may now open a PR that links this issue with \`Closes #${issue_number}\` (max 3 open PRs at a time).`);
