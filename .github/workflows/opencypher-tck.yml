name: openCypher TCK compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compatibility-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The kernel links libgraphblas unconditionally, so this job needs it even
      # though the report itself only exercises the parser.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcypher-parser-dev libgraphblas-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-29

      # This job's `cargo run` compiled the whole opencypher feature set from
      # scratch every time. `save-if` restricts writes to main for the same
      # cache-budget reason as ci.yml.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: opencypher-tck
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Deliberately outside `target/`: rust-cache saves the target directory,
      # so a corpus checkout parked in there would be packed into the cache
      # entry on every run.
      - name: Checkout official openCypher corpus
        run: |
          git clone --depth 1 https://github.com/opencypher/openCypher.git "${RUNNER_TEMP}/openCypher"

      - name: Generate compatibility report
        run: |
          cargo run --features opencypher --example opencypher_tck_report -- \
            "${RUNNER_TEMP}/openCypher/tck/features" \
            > "${RUNNER_TEMP}/opencypher-tck-compatibility.json"

      - name: Upload compatibility report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencypher-tck-compatibility
          path: ${{ runner.temp }}/opencypher-tck-compatibility.json
