name: openCypher TCK compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compatibility-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install libcypher parser
        run: |
          sudo apt-get update
          sudo apt-get install -y libcypher-parser-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout official openCypher corpus
        run: |
          git clone --depth 1 https://github.com/opencypher/openCypher.git target/openCypher

      - name: Generate compatibility report
        run: |
          cargo run --features opencypher --example opencypher_tck_report -- target/openCypher/tck/features > target/opencypher-tck-compatibility.json

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: opencypher-tck-compatibility
          path: target/opencypher-tck-compatibility.json
