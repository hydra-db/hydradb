name: PR limit

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Comment "N of 3" on all existing open PRs'
        type: boolean
        default: true

permissions:
  pull-requests: write
  contents: read

env:
  MAX_OPEN: 3

jobs:
  enforce:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MAX = parseInt(process.env.MAX_OPEN, 10);
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const number = pr.number;

            const got = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo, path: '.github/vouched.json', ref: context.payload.repository.default_branch });
            const roster = JSON.parse(Buffer.from(got.data.content, 'base64').toString('utf8'));
            // Anyone with write access (the backend team) counts as a maintainer.
            const isTeam = async (login) => (roster.maintainers || []).includes(login) ||
              ['admin', 'write'].includes(await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: login }).then(r => r.data.permission, () => 'none'));

            // The cap went live when #230 merged; older PRs are exempt (they still count towards a new PR's total).
            const capStart = new Date('2026-10-08T11:57:53Z');
            const overridden = (p) => (p.labels || []).some(l => l.name === 'gate-override');

            if (pr.user.type === 'Bot') { core.info('Bot PR, exempt from cap.'); return; }
            if (new Date(pr.created_at) < capStart) { core.info('Opened before the cap, exempt.'); return; }
            if (overridden(pr)) { core.info('Has gate-override, exempt from cap.'); return; }
            if (context.payload.action === 'reopened' && await isTeam(context.payload.sender.login)) { core.info('Reopened by a maintainer, exempt from cap.'); return; }
            if (await isTeam(author)) { core.info('Maintainer, exempt from cap.'); return; }
            const found = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:open author:${author} -is:draft`, per_page: 100 });
            const open = found.map(p => p.number).sort((a, b) => a - b);
            const rank = open.indexOf(number) + 1 || open.length;

            if (open.length > MAX) {
              // Close the newest PRs over the cap (CONTRIBUTING.md), not the PR that triggered this run.
              // Old and overridden PRs count towards the total but are never closed here.
              const toClose = found
                .filter(p => new Date(p.created_at) >= capStart && !overridden(p))
                .map(p => p.number).sort((a, b) => b - a)
                .slice(0, open.length - MAX);
              for (const n of toClose) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n,
                  body: `You have ${open.length} open PRs, over the limit of ${MAX}. Closing this one, your newest; please get an existing PR merged or closed first. The fastest way to get an open PR closed is to ask in the #pr-discussion channel on [Discord](https://discord.gg/YPtwenvxY8).` });
                await github.rest.pulls.update({ owner: context.repo.owner, repo: context.repo.repo, pull_number: n, state: 'closed' });
              }
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number,
                body: `This is PR ${rank} of ${MAX} you may keep open at a time.` });
            }

  backfill:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MAX = parseInt(process.env.MAX_OPEN, 10);
            const got = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo, path: '.github/vouched.json', ref: context.payload.repository.default_branch });
            const maintainers = (JSON.parse(Buffer.from(got.data.content, 'base64').toString('utf8')).maintainers) || [];

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const byAuthor = {};
            for (const p of prs) {
              if (p.draft) continue;
              const a = p.user.login;
              if (maintainers.includes(a)) continue;
              (byAuthor[a] ||= []).push(p.number);
            }
            for (const [a, nums] of Object.entries(byAuthor)) {
              nums.sort((x, y) => x - y);
              const total = nums.length;
              const over = total - MAX;
              for (let i = 0; i < total; i++) {
                const rank = i + 1;
                const body = over <= 0
                  ? `This is PR ${rank} of ${MAX} you may keep open at a time, @${a}.`
                  : `⚠️ @${a}, you have ${total} open PRs, over the limit of ${MAX}. This is PR ${rank}. **Please close at least ${over} of your open PRs** to get within the limit, or new PRs will be closed automatically. Fastest way to close one: ask in the #pr-discussion channel on [Discord](https://discord.gg/YPtwenvxY8).`;
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: nums[i], body });
              }
            }
