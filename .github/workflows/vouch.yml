name: Vouch

# Writing .github/vouched.json to a protected default branch needs the workflow
# actor on the branch ruleset's bypass list (contents: write below is not enough
# on its own if a ruleset blocks direct pushes).

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  vouch:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/vouch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MAX_VOUCHES = 5;
            const commenter = context.payload.comment.user.login;
            const body = context.payload.comment.body.trim();
            const m = body.match(/^\/vouch\s+@?([A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?)\s*$/);
            const react = (c) => github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: c });
            const reply = (msg) => github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.issue.number, body: msg });

            if (!m) { await react('confused'); await reply('Usage: `/vouch @handle`'); return; }
            const target = m[1];

            const path = '.github/vouched.json';
            const got = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path });
            const roster = JSON.parse(Buffer.from(got.data.content, 'base64').toString('utf8'));
            const maintainers = roster.maintainers || [];
            const vouched = roster.vouched || {};

            if (!maintainers.includes(commenter)) {
              await react('-1');
              await reply(`@${commenter} only maintainers can \`/vouch\`.`);
              return;
            }
            if (maintainers.includes(target) || vouched[target]) {
              await reply(`@${target} is already vouched.`);
              return;
            }
            const used = Object.values(vouched).filter(v => v === commenter).length;
            if (used >= MAX_VOUCHES) {
              await react('-1');
              await reply(`@${commenter} you have reached the limit of ${MAX_VOUCHES} vouches.`);
              return;
            }

            vouched[target] = commenter;
            roster.vouched = vouched;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path,
              message: `chore(vouch): ${commenter} vouches ${target}`,
              content: Buffer.from(JSON.stringify(roster, null, 2) + '\n').toString('base64'),
              sha: got.data.sha,
            });
            await react('+1');
            await reply(`@${target} has been vouched by @${commenter} (${used + 1}/${MAX_VOUCHES}). An issue of yours can now be \`/approved\`.`);
