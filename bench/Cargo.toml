[package]
name = "turbolay-bench"
version = "0.1.0"
edition.workspace = true
publish = false
description = "LDBC-shaped synthetic benchmark harness for turbolay (RFC 0017 Phase 3)."

[[bin]]
name = "turbolay-bench"
path = "src/main.rs"

[dependencies]
# The engine under test. turbolay is the workspace-root package.
turbolay = { path = ".." }
# StorageConfig / ObjectStoreConfig / AwsObjectStoreConfig / LocalObjectStoreConfig
# for the --backend memory|local|s3 flag.
common = { path = "../vendor/common", package = "opendata-common" }

tokio = { workspace = true }
roaring = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
csv = "1.3"
uuid = { workspace = true, features = ["v7"] }
