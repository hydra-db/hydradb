# The root stays the `slatedb-graph-kernel` package and merely gains a
# `[workspace]` table, so every bare `cargo test --features …` in CI, the
# justfile and scripts/ still resolves to the root package. A virtual manifest
# would have broken all of them.
#
# `exclude` covers the vendored Quint/CosmWasm sample manifests under `docs/`,
# which are gitignored but present in working trees.
[workspace]
members = ["crates/placement", "crates/telemetry"]
exclude = ["docs"]

# One place for every third-party version, so a member cannot drift from the
# root. Members inherit with `{ workspace = true }`. Two rules worth knowing
# before editing: `optional` is *not* inheritable and must be repeated at each
# use site, and features listed here are a floor a member can add to but never
# subtract from — so what is recorded below is the union across all use sites.
[workspace.dependencies]
async-trait = "0.1"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
boltr = "0.2.0"
bytes = "1"
# `serde` is declared rather than inherited. It does arrive anyway through
# feature unification with `object_store`, but placement's heartbeat body
# derives Serialize/Deserialize on a `DateTime<Utc>`, and a dependency that
# compiles only because something else happens to turn a feature on breaks the
# day that something else stops.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
libcypher-parser-sys = "0.6.1-1"
# The OpenTelemetry set is used only by `crates/telemetry`, behind its
# off-by-default `otlp` feature, so nothing here reaches the kernel or a bare
# `cargo test`. They live in this table anyway because the versions are paired,
# not free: `tracing-opentelemetry` 0.33 is the release that targets
# `opentelemetry` 0.32, and bumping one without the others silently stops the
# `OpenTelemetrySpanExt` trait applying to the installed tracer. One table, one
# bump. `optional` is not inheritable and stays at the use site.
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
# `reqwest-blocking-client`, not `reqwest-client`, and it is not a preference.
# `opentelemetry_sdk`'s batch processors run on their own dedicated OS threads,
# which are not tokio workers, so the async client panics there with "there is
# no reactor running" and no span or log record ever reaches the collector. The
# blocking client is what upstream enables by default for this exact reason;
# the batching already keeps the export off the request path.
#
# `metrics` is in the list for the same reason `trace` and `logs` are: with
# `default-features = false` nothing is on implicitly, and without it
# `opentelemetry_otlp::MetricExporter` simply does not exist in this build —
# a missing-type error that reads like a version mismatch and is not one.
# `PeriodicReader` runs on its own OS thread too, so `reqwest-blocking-client`
# is load-bearing for the metrics pipeline exactly as it is for the other two.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "logs", "metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
rcgen = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
slatedb = { git = "https://github.com/usecortex/slatedb.git", rev = "cec010de2bd48703756327b8948aff5008d3313e", default-features = false, features = ["aws", "foyer"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ulid = "1"

[package]
name = "slatedb-graph-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "A SlateDB-backed object-store graph kernel"
repository = "https://github.com/usecortex/slatedb-graph-kernel"
readme = "README.md"
publish = false

[features]
default = []
opencypher = ["dep:libcypher-parser-sys"]
chaos-harness = []
json-properties = ["dep:serde_json"]
query-transport = ["opencypher", "dep:base64", "dep:serde", "dep:subtle", "json-properties", "tokio/io-util", "tokio/net"]
query-transport-tls = ["query-transport", "dep:tokio-rustls"]
query-service-discovery = ["query-transport", "dep:reqwest"]
client-api = ["query-transport"]
bolt-server = ["client-api", "query-transport-tls", "dep:boltr"]
http-api = ["client-api", "query-transport-tls", "dep:axum", "dep:axum-server"]
public-client-protocols = ["bolt-server", "http-api"]
server-runtime = [
    "public-client-protocols",
    "query-service-discovery",
    "dep:rustls-pemfile",
    "dep:tracing-subscriber",
    "dep:turbolay-telemetry",
]
indexer-runtime = ["dep:axum", "dep:tracing-subscriber", "tokio/net", "dep:turbolay-telemetry"]

# OTLP export, off by default and never enabled by another feature. Off, the
# binaries still initialise telemetry and still emit JSON to stdout — they just
# install no exporter, so a build without a collector is the normal build. This
# is the one deviation from `docs/plans/2026-07-26-otel-telemetry-crate.md` §1,
# which claimed no root `[features]` entry would be needed: true of the library,
# but the binaries are in this package, so shipping OTLP at all needs a switch
# here. It is additive — no existing combination changes meaning.
otlp = ["turbolay-telemetry/otlp"]

[[bin]]
name = "graph-node"
path = "src/bin/graph-node.rs"
required-features = ["server-runtime"]

[[bin]]
name = "graph-indexer"
path = "src/bin/graph-indexer.rs"
required-features = ["indexer-runtime"]

[[example]]
name = "fence_worker"
path = "examples/fence_worker.rs"
required-features = ["chaos-harness"]

[[example]]
name = "opencypher_tck_report"
path = "examples/opencypher_tck_report.rs"
required-features = ["opencypher"]

[[example]]
name = "query_bench"
path = "examples/query_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "query_correctness"
path = "examples/query_correctness.rs"
required-features = ["opencypher"]

[[example]]
name = "multigraph_bench"
path = "examples/multigraph_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "falkor_import"
path = "examples/falkor_import.rs"
required-features = ["json-properties"]

[[example]]
name = "cypher_query"
path = "examples/cypher_query.rs"
required-features = ["opencypher"]

[[example]]
name = "falkor_query_bench"
path = "examples/falkor_query_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "bolt_compat_server"
path = "examples/bolt_compat_server.rs"
required-features = ["bolt-server"]

[[example]]
name = "bolt_benchmark"
path = "examples/bolt_benchmark.rs"
required-features = ["public-client-protocols"]

[[example]]
name = "s3_bolt_benchmark_server"
path = "examples/s3_bolt_benchmark_server.rs"
required-features = ["server-runtime"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
boltr = { workspace = true, optional = true }
bytes = { workspace = true }
base64 = { workspace = true, optional = true }
# Direct, not transitive. `turbolay-placement` takes `DateTime<Utc>` on its
# heartbeat and LIST boundaries, and without this the type is not nameable in
# the kernel at all — `object_store` does not re-export chrono. Two independent
# attempts at the placement wiring both worked around that by writing
# `SystemTime::now().into()` and leaning on inference to pick the conversion,
# which is the same instant by the same clock but says so nowhere.
chrono = { workspace = true }
futures = { workspace = true }
libcypher-parser-sys = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
slatedb = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
sha2 = { workspace = true }
subtle = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
turbolay-placement = { path = "crates/placement" }
ulid = { workspace = true }
# Optional, because only `src/bin/` uses it: the library half of this package
# emits through the plain `tracing` facade and must keep compiling — and
# testing — with no subscriber crate in sight. `server-runtime` and
# `indexer-runtime` turn it on because those are the two features that build a
# binary, which is the only place a subscriber may be installed.
#
# Note this pulls no `opentelemetry-*`: the telemetry crate's own `otlp` feature
# is off by default, so a bare `cargo test` and every existing feature
# combination resolve exactly as they did before. Turning OTLP on is the root
# `otlp` feature below, and nothing enables it implicitly.
turbolay-telemetry = { path = "crates/telemetry", optional = true }

[dev-dependencies]
boltr = { workspace = true, features = ["client"] }
serde = { workspace = true }
# `test-util` is what `#[tokio::test(start_paused = true)]` needs, and the fence
# backoff tests in `src/core/state.rs` are built on it. It does arrive anyway
# through feature unification with `fail-parallel`, a slatedb dependency, but
# those tests would stop compiling the day that transitive path changes.
tokio = { workspace = true, features = ["test-util"] }
serde_yaml = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
