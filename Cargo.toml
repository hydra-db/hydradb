# The root stays the `slatedb-graph-kernel` package and merely gains a
# `[workspace]` table, so every bare `cargo test --features …` in CI, the
# justfile and scripts/ still resolves to the root package. A virtual manifest
# would have broken all of them.
#
# `exclude` covers the vendored Quint/CosmWasm sample manifests under `docs/`,
# which are gitignored but present in working trees.
[workspace]
members = ["crates/placement"]
exclude = ["docs"]

# One place for every third-party version, so a member cannot drift from the
# root. Members inherit with `{ workspace = true }`. Two rules worth knowing
# before editing: `optional` is *not* inheritable and must be repeated at each
# use site, and features listed here are a floor a member can add to but never
# subtract from — so what is recorded below is the union across all use sites.
[workspace.dependencies]
async-trait = "0.1"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
boltr = "0.2.0"
bytes = "1"
# `serde` is declared rather than inherited. It does arrive anyway through
# feature unification with `object_store`, but placement's heartbeat body
# derives Serialize/Deserialize on a `DateTime<Utc>`, and a dependency that
# compiles only because something else happens to turn a feature on breaks the
# day that something else stops.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
libcypher-parser-sys = "0.6.1-1"
rcgen = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
slatedb = { git = "https://github.com/usecortex/slatedb.git", rev = "9f4d30400808866359f5c9c67de357bdc2fa5e5f", default-features = false, features = ["aws", "foyer"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[package]
name = "slatedb-graph-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "A SlateDB-backed object-store graph kernel"
repository = "https://github.com/usecortex/slatedb-graph-kernel"
readme = "README.md"
publish = false

[features]
default = []
opencypher = ["dep:libcypher-parser-sys"]
chaos-harness = []
json-properties = ["dep:serde_json"]
query-transport = ["opencypher", "dep:base64", "dep:serde", "dep:subtle", "json-properties", "tokio/io-util", "tokio/net"]
query-transport-tls = ["query-transport", "dep:tokio-rustls"]
query-service-discovery = ["query-transport", "dep:reqwest"]
client-api = ["query-transport"]
bolt-server = ["client-api", "query-transport-tls", "dep:boltr"]
http-api = ["client-api", "query-transport-tls", "dep:axum", "dep:axum-server"]
public-client-protocols = ["bolt-server", "http-api"]
server-runtime = [
    "public-client-protocols",
    "query-service-discovery",
    "dep:rustls-pemfile",
    "dep:tracing-subscriber",
]
indexer-runtime = ["dep:axum", "dep:tracing-subscriber", "tokio/net"]

[[bin]]
name = "graph-node"
path = "src/bin/graph-node.rs"
required-features = ["server-runtime"]

[[bin]]
name = "graph-indexer"
path = "src/bin/graph-indexer.rs"
required-features = ["indexer-runtime"]

[[example]]
name = "fence_worker"
path = "examples/fence_worker.rs"
required-features = ["chaos-harness"]

[[example]]
name = "opencypher_tck_report"
path = "examples/opencypher_tck_report.rs"
required-features = ["opencypher"]

[[example]]
name = "query_bench"
path = "examples/query_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "query_correctness"
path = "examples/query_correctness.rs"
required-features = ["opencypher"]

[[example]]
name = "multigraph_bench"
path = "examples/multigraph_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "falkor_import"
path = "examples/falkor_import.rs"
required-features = ["json-properties"]

[[example]]
name = "cypher_query"
path = "examples/cypher_query.rs"
required-features = ["opencypher"]

[[example]]
name = "falkor_query_bench"
path = "examples/falkor_query_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "bolt_compat_server"
path = "examples/bolt_compat_server.rs"
required-features = ["bolt-server"]

[[example]]
name = "bolt_benchmark"
path = "examples/bolt_benchmark.rs"
required-features = ["public-client-protocols"]

[[example]]
name = "s3_bolt_benchmark_server"
path = "examples/s3_bolt_benchmark_server.rs"
required-features = ["server-runtime"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
boltr = { workspace = true, optional = true }
bytes = { workspace = true }
base64 = { workspace = true, optional = true }
futures = { workspace = true }
libcypher-parser-sys = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
slatedb = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
sha2 = { workspace = true }
subtle = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
boltr = { workspace = true, features = ["client"] }
serde = { workspace = true }
serde_yaml = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
