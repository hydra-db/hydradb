[workspace]
resolver = "2"
# The root `turbolay` package is a member implicitly; `vendor/common` is our
# vendored fork of opendata-common (see below).
members = ["vendor/common", "vendor/macros"]

[workspace.package]
edition = "2024"

# Single source of truth for shared dependency versions. Both the root crate and
# the vendored `common` fork inherit these via `<dep>.workspace = true`. The
# versions were pinned to what the opendata workspace used at fork time so the
# vendored crate builds byte-for-byte as upstream.
[workspace.dependencies]
async-trait = "0.1"
arc-swap = "1"
bytes = "1.0"
foyer = "0.22"
futures = { version = "0.3", features = ["std"] }
metrics = "0.24"
mixtrics = "0.2"
proptest = "1"
roaring = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
slatedb = { version = "0.14.0", features = ["compaction_filters"] }
slatedb-common = "0.14.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"
uuid = "1.14.0"

[package]
name = "turbolay"
version = "0.1.0"
edition.workspace = true

[lib]
name = "turbolay"
path = "src/lib.rs"

[[bin]]
name = "turbolay"
path = "src/main.rs"

[dependencies]
# opendata substrate: serde toolkit, StorageBuilder, SequenceAllocator, merge framework.
# VENDORED fork (M1) at vendor/common so turbolay can extend the storage layer
# (WriteOptions.seqnum injection, RFC 0004) without touching the shared upstream
# crate. See docs/impl/2026-07-03-m1-spike-and-seqnum-decision.md.
common = { path = "vendor/common", package = "opendata-common" }

bytes.workspace = true
thiserror.workspace = true
# Posting-list substrate (RFC 0005).
roaring.workspace = true
# openCypher frontend (RFC 0007 / Q23): vendored fork at ../decypher, consumed as
# a path dep so it stays a separate crate/repo we can modify + rebase on upstream.
# `hir` (default) is the lowering seam (decypher HIR -> PlanNode IR); `miette` for
# rich diagnostics. MSRV 1.94 -> see rust-toolchain.toml.
decypher = { path = "../decypher", features = ["miette"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
# RFC 0017 Phase 0 (observability spine): the `metrics` facade (no-op unless a
# recorder is installed — safe for library code to call unconditionally) and
# `async-trait` to implement `common::object_store::ObjectStore` for
# `obs::InstrumentedObjectStore`.
metrics.workspace = true
async-trait.workspace = true
# `object_store`'s own required `ObjectStore` methods return its private
# `BoxStream` alias (`Pin<Box<dyn Stream<Item = T> + Send>>`, not re-exported
# by the `object_store` crate) — implementing the trait means naming that
# return type ourselves via the equivalent `futures::stream::BoxStream` (same
# underlying type; `common` already depends on `futures` at this exact
# version). Needed for `InstrumentedObjectStore`'s `list`/`delete_stream`.
futures.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# `FailingStorage` fault-injection (M1 D6 crash-recovery test, RFC 0004
# acceptance #1) — test-only, mirrors the `[dependencies]` `common` path dep.
common = { path = "vendor/common", package = "opendata-common", features = [
    "test-utils",
] }
# SlateDB-on-local-disk acceptance tier (`tests/slatedb_acceptance.rs`, M1 Wave
# 4 Workstream B): a real tempdir backs `StorageConfig::SlateDb` so durable
# gate / zombie-writer fencing / crash-recovery can be exercised against real
# SlateDB, not just the in-memory backend (RFC 0017 D12 is about S3/LocalStack
# benchmarking, not this — SlateDB correctness over a local object store).
tempfile.workspace = true
