[package]
name = "slatedb-graph-kernel"
version = "0.1.0"
edition = "2021"
description = "A SlateDB-backed object-store graph kernel prototype"
repository = "https://github.com/usecortex/slatedb-graph-kernel"
readme = "README.md"
publish = false

[features]
default = []
opencypher = ["dep:libcypher-parser-sys"]
graphblas = []
chaos-harness = []
query-transport = ["opencypher", "dep:serde", "dep:serde_json", "tokio/io-util", "tokio/net"]
query-transport-tls = ["query-transport", "dep:tokio-rustls"]

[[example]]
name = "phase0_fence_worker"
path = "examples/phase0_fence_worker.rs"
required-features = ["chaos-harness"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
libcypher-parser-sys = { version = "0.6.1-1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
slatedb = { git = "https://github.com/slatedb/slatedb.git", rev = "a6e169dc1e143fa72a0aa916a9b23cf29b3656b4", default-features = false, features = ["aws", "foyer"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", optional = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
