[package]
name = "slatedb-graph-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "A SlateDB-backed object-store graph kernel"
repository = "https://github.com/usecortex/slatedb-graph-kernel"
readme = "README.md"
publish = false

[features]
default = []
opencypher = ["dep:libcypher-parser-sys"]
graphblas = []
chaos-harness = []
json-properties = ["dep:serde_json"]
query-transport = ["opencypher", "dep:serde", "dep:subtle", "json-properties", "tokio/io-util", "tokio/net"]
query-transport-tls = ["query-transport", "dep:tokio-rustls"]
query-service-discovery = ["query-transport", "dep:base64", "dep:reqwest"]
client-api = ["query-transport"]
bolt-server = ["client-api", "query-transport-tls", "dep:boltr"]
http-api = ["client-api", "query-transport-tls", "dep:axum", "dep:axum-server"]
public-client-protocols = ["bolt-server", "http-api"]
server-runtime = [
    "public-client-protocols",
    "graphblas",
    "query-service-discovery",
    "dep:rustls-pemfile",
    "dep:tracing-subscriber",
]
indexer-runtime = ["dep:axum", "dep:tracing-subscriber", "tokio/net"]

[[bin]]
name = "graph-node"
path = "src/bin/graph-node.rs"
required-features = ["server-runtime"]

[[bin]]
name = "graph-indexer"
path = "src/bin/graph-indexer.rs"
required-features = ["indexer-runtime"]

[[example]]
name = "fence_worker"
path = "examples/fence_worker.rs"
required-features = ["chaos-harness"]

[[example]]
name = "opencypher_tck_report"
path = "examples/opencypher_tck_report.rs"
required-features = ["opencypher"]

[[example]]
name = "query_bench"
path = "examples/query_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "query_correctness"
path = "examples/query_correctness.rs"
required-features = ["opencypher"]

[[example]]
name = "multigraph_bench"
path = "examples/multigraph_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "falkor_import"
path = "examples/falkor_import.rs"
required-features = ["json-properties"]

[[example]]
name = "cypher_query"
path = "examples/cypher_query.rs"
required-features = ["opencypher"]

[[example]]
name = "falkor_query_bench"
path = "examples/falkor_query_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "bolt_compat_server"
path = "examples/bolt_compat_server.rs"
required-features = ["bolt-server"]

[[example]]
name = "bolt_benchmark"
path = "examples/bolt_benchmark.rs"
required-features = ["public-client-protocols"]

[[example]]
name = "s3_bolt_benchmark_server"
path = "examples/s3_bolt_benchmark_server.rs"
required-features = ["server-runtime"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", optional = true }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
boltr = { version = "0.2.0", optional = true }
bytes = "1"
base64 = { version = "0.22", optional = true }
futures = "0.3"
libcypher-parser-sys = { version = "0.6.1-1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"], optional = true }
rustls-pemfile = { version = "2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
slatedb = { git = "https://github.com/usecortex/slatedb.git", rev = "224177d47a47952c76f5749ed780caed7d07a5d9", default-features = false, features = ["aws", "foyer"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", optional = true }
sha2 = "0.10"
subtle = { version = "2", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"], optional = true }

[dev-dependencies]
boltr = { version = "0.2.0", features = ["client"] }
serde = "1"
serde_yaml = "0.9"
rcgen = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
