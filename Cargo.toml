[package]
name = "slatedb-graph-kernel"
version = "0.1.0"
edition = "2021"
description = "A SlateDB-backed object-store graph kernel prototype"
repository = "https://github.com/usecortex/slatedb-graph-kernel"
readme = "README.md"
publish = false

[features]
default = []
opencypher = ["dep:libcypher-parser-sys"]
graphblas = []
chaos-harness = []
json-properties = ["dep:serde_json"]
query-transport = ["opencypher", "dep:serde", "json-properties", "tokio/io-util", "tokio/net"]
query-transport-tls = ["query-transport", "dep:tokio-rustls", "dep:sha2"]
query-service-discovery = ["query-transport", "dep:base64", "dep:reqwest"]

[[example]]
name = "fence_worker"
path = "examples/fence_worker.rs"
required-features = ["chaos-harness"]

[[example]]
name = "opencypher_tck_report"
path = "examples/opencypher_tck_report.rs"
required-features = ["opencypher"]

[[example]]
name = "query_bench"
path = "examples/query_bench.rs"
required-features = ["opencypher"]

[[example]]
name = "query_correctness"
path = "examples/query_correctness.rs"
required-features = ["opencypher"]

[dependencies]
async-trait = "0.1"
bytes = "1"
base64 = { version = "0.22", optional = true }
futures = "0.3"
libcypher-parser-sys = { version = "0.6.1-1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
slatedb = { git = "https://github.com/slatedb/slatedb.git", rev = "a6e169dc1e143fa72a0aa916a9b23cf29b3656b4", default-features = false, features = ["aws", "foyer"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", optional = true }
sha2 = { version = "0.10", optional = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
